<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/><stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="1000" height="650" fill="url(#bgGrad)"/>
  
  <!-- Terminal Top Bar -->
  <rect width="1000" height="52" fill="#2E0832"/>
  <circle cx="28" cy="26" r="8" fill="#A855F7"/>
  <text x="46" y="32" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="16" letter-spacing="1">PURPLE KEYS POS</text>
  <text x="500" y="32" fill="#E2E8F0" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="14" text-anchor="middle">OFFLINE-FIRST ARCHITECTURE & NETWORK RESILIENCE</text>
  <rect x="850" y="14" width="125" height="24" rx="12" fill="#10B981" fill-opacity="0.2"/>
  <circle cx="864" cy="26" r="4" fill="#10B981"/>
  <text x="876" y="31" fill="#10B981" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11">ONLINE • v2.0</text>

  <!-- Screen Body -->
  <g transform="translate(0, 52)">
    
    <rect x="60" y="35" width="880" height="500" rx="16" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="95" y="75" fill="#FFFFFF" font-family="sans-serif" font-size="20" font-weight="800">ENTERPRISE OFFLINE CONTINUITY ENGINE</text>
    <text x="95" y="100" fill="#94A3B8" font-family="sans-serif" font-size="13">Automatic zero-downtime failover during Wi-Fi disconnects or central server outages.</text>

    <!-- 3 Step Visual Diagram -->
    <g transform="translate(95, 140)">
      <!-- Box 1 -->
      <rect x="0" y="0" width="240" height="230" rx="12" fill="#0F172A" stroke="#EF4444" stroke-width="2"/>
      <circle cx="120" cy="50" r="26" fill="#FEE2E2"/>
      <text x="110" y="58" font-size="22">📡</text>
      <text x="120" y="105" fill="#FFFFFF" font-family="sans-serif" font-size="15" font-weight="800" text-anchor="middle">1. Network Drop Detected</text>
      <text x="120" y="135" fill="#94A3B8" font-family="sans-serif" font-size="12" text-anchor="middle">Network sentinel senses</text>
      <text x="120" y="155" fill="#94A3B8" font-family="sans-serif" font-size="12" text-anchor="middle">zero-latency disconnect</text>
      <rect x="25" y="180" width="190" height="28" rx="6" fill="#EF4444" fill-opacity="0.2"/>
      <text x="120" y="198" fill="#F87171" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle">ZERO BILLING INTERRUPTION</text>

      <!-- Arrow 1 -->
      <path d="M 255 115 L 290 115" stroke="#38BDF8" stroke-width="3"/>
      <polygon points="290,110 300,115 290,120" fill="#38BDF8"/>

      <!-- Box 2 -->
      <rect x="315" y="0" width="240" height="230" rx="12" fill="#0F172A" stroke="#A855F7" stroke-width="2"/>
      <circle cx="435" cy="50" r="26" fill="#F3E8FF"/>
      <text x="425" y="58" font-size="22">💾</text>
      <text x="435" y="105" fill="#FFFFFF" font-family="sans-serif" font-size="15" font-weight="800" text-anchor="middle">2. Local Hive Queue</text>
      <text x="435" y="135" fill="#94A3B8" font-family="sans-serif" font-size="12" text-anchor="middle">Bills, KOTs, BOTs saved</text>
      <text x="435" y="155" fill="#94A3B8" font-family="sans-serif" font-size="12" text-anchor="middle">locally with UUID tokens</text>
      <rect x="340" y="180" width="190" height="28" rx="6" fill="#A855F7" fill-opacity="0.2"/>
      <text x="435" y="198" fill="#C084FC" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle">SUB-10ms LOCAL WRITES</text>

      <!-- Arrow 2 -->
      <path d="M 570 115 L 605 115" stroke="#38BDF8" stroke-width="3"/>
      <polygon points="605,110 615,115 605,120" fill="#38BDF8"/>

      <!-- Box 3 -->
      <rect x="630" y="0" width="240" height="230" rx="12" fill="#0F172A" stroke="#10B981" stroke-width="2"/>
      <circle cx="750" cy="50" r="26" fill="#DCFCE7"/>
      <text x="740" y="58" font-size="22">⚡</text>
      <text x="750" y="105" fill="#FFFFFF" font-family="sans-serif" font-size="15" font-weight="800" text-anchor="middle">3. Background Sync</text>
      <text x="750" y="135" fill="#94A3B8" font-family="sans-serif" font-size="12" text-anchor="middle">When server reconnects,</text>
      <text x="750" y="155" fill="#94A3B8" font-family="sans-serif" font-size="12" text-anchor="middle">queue reconciles seamlessly</text>
      <rect x="655" y="180" width="190" height="28" rx="6" fill="#10B981" fill-opacity="0.2"/>
      <text x="750" y="198" fill="#4ADE80" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle">100% RECONCILED DATA</text>
    </g>

    <rect x="95" y="410" width="810" height="95" rx="12" fill="#0F172A" stroke="#334155"/>
    <text x="120" y="440" fill="#38BDF8" font-family="sans-serif" font-size="13" font-weight="800">GUARANTEED HIGH AVAILABILITY (HA) SLA</text>
    <text x="120" y="465" fill="#94A3B8" font-family="sans-serif" font-size="12">Hotels and busy bars cannot afford register freeze during peak hours. Purple Keys POS isolates terminal operations so a disconnected network never stops cashiers from generating valid bills or printing thermal receipts.</text>
    
  </g>
</svg>