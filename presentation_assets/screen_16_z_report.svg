<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/><stop offset="100%" stop-color="#EDF2F7"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="1000" height="650" fill="url(#bgGrad)"/>
  
  <!-- Terminal Top Bar -->
  <rect width="1000" height="52" fill="#2E0832"/>
  <circle cx="28" cy="26" r="8" fill="#A855F7"/>
  <text x="46" y="32" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="16" letter-spacing="1">PURPLE KEYS POS</text>
  <text x="500" y="32" fill="#E2E8F0" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="14" text-anchor="middle">CASH DRAWER RECONCILIATION & FISCAL Z-REPORT</text>
  <rect x="850" y="14" width="125" height="24" rx="12" fill="#10B981" fill-opacity="0.2"/>
  <circle cx="864" cy="26" r="4" fill="#10B981"/>
  <text x="876" y="31" fill="#10B981" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11">ONLINE • v2.0</text>

  <!-- Screen Body -->
  <g transform="translate(0, 52)">
    
    <rect x="60" y="25" width="450" height="520" rx="16" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#cardShadow)"/>
    <text x="90" y="65" fill="#0F172A" font-family="sans-serif" font-size="18" font-weight="800">CASH DENOMINATION AUDIT</text>
    <text x="90" y="88" fill="#64748B" font-family="sans-serif" font-size="12">Physical currency count vs system expected sales</text>

    <!-- Denomination Table -->
    <g font-family="sans-serif" font-size="13" fill="#1E293B">
      <text x="90" y="130" font-weight="700">₹500 x 42 notes</text>
      <text x="470" y="130" font-weight="800" text-anchor="end">₹21,000.00</text>

      <text x="90" y="165" font-weight="700">₹200 x 30 notes</text>
      <text x="470" y="165" font-weight="800" text-anchor="end">₹6,000.00</text>

      <text x="90" y="200" font-weight="700">₹100 x 55 notes</text>
      <text x="470" y="200" font-weight="800" text-anchor="end">₹5,500.00</text>

      <text x="90" y="235" font-weight="700">₹50 x 20 notes</text>
      <text x="470" y="235" font-weight="800" text-anchor="end">₹1,000.00</text>

      <text x="90" y="270" font-weight="700">Coins & Petty Change</text>
      <text x="470" y="270" font-weight="800" text-anchor="end">₹350.00</text>
    </g>

    <line x1="90" y1="295" x2="470" y2="295" stroke="#E2E8F0" stroke-width="1.5"/>

    <!-- Total Reconciled -->
    <rect x="85" y="320" width="390" height="70" rx="12" fill="#F0FDF4" stroke="#BBF7D0"/>
    <text x="105" y="350" fill="#166534" font-family="sans-serif" font-size="12" font-weight="800">PHYSICAL CASH IN DRAWER</text>
    <text x="105" y="378" fill="#15803D" font-family="sans-serif" font-size="22" font-weight="800">₹33,850.00</text>
    <text x="455" y="365" fill="#15803D" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="end">Variance: ₹0.00 ✓</text>

    <rect x="85" y="420" width="390" height="90" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="105" y="445" fill="#475569" font-family="sans-serif" font-size="12" font-weight="700">Shift Operator: Suresh Kumar (Emp #104)</text>
    <text x="105" y="470" fill="#475569" font-family="sans-serif" font-size="12" font-weight="700">Terminal: POS-01 • Shift: Evening (16:00 - 23:30)</text>
    <text x="105" y="495" fill="#7C3AED" font-family="sans-serif" font-size="12" font-weight="800">Manager Sign-off PIN: Verified ✓</text>

    <!-- Z-Report Strip Right Column -->
    <rect x="540" y="25" width="400" height="520" rx="16" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#cardShadow)"/>
    <text x="570" y="65" fill="#0F172A" font-family="sans-serif" font-size="18" font-weight="800">DAILY FISCAL Z-REPORT</text>
    <text x="570" y="88" fill="#64748B" font-family="sans-serif" font-size="12">Permanent tamper-proof day closeout record</text>

    <!-- Report Breakdown -->
    <g transform="translate(570, 120)" font-family="sans-serif" font-size="13" fill="#334155">
      <text y="0">Gross Revenue:</text>
      <text x="340" y="0" font-weight="800" fill="#0F172A" text-anchor="end">₹1,42,850.00</text>

      <text y="30">Liquor Sales (BOT):</text>
      <text x="340" y="30" font-weight="700" text-anchor="end">₹92,400.00</text>

      <text y="60">Food & Kitchen (KOT):</text>
      <text x="340" y="60" font-weight="700" text-anchor="end">₹42,150.00</text>

      <text y="90">Beverages & Tobacco:</text>
      <text x="340" y="90" font-weight="700" text-anchor="end">₹8,300.00</text>

      <line x1="0" y1="110" x2="340" y2="110" stroke="#E2E8F0"/>

      <text y="135">Total Tax Collected (VAT + GST):</text>
      <text x="340" y="135" font-weight="700" text-anchor="end">₹11,480.00</text>

      <text y="165">Discounts & Comps (Manager Auth):</text>
      <text x="340" y="165" font-weight="700" fill="#DC2626" text-anchor="end">-₹1,850.00</text>

      <text y="195">Voids & Cancelled KOTs:</text>
      <text x="340" y="195" font-weight="700" fill="#DC2626" text-anchor="end">₹0.00 (Audit Clear)</text>
    </g>

    <!-- Close Register Button -->
    <rect x="570" y="380" width="340" height="60" rx="12" fill="#DC2626" filter="url(#cardShadow)"/>
    <text x="740" y="416" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="800" text-anchor="middle">EXECUTE FISCAL Z-CLOSEOUT 🔒</text>

    <text x="570" y="475" fill="#64748B" font-family="sans-serif" font-size="11" font-weight="500">Freezes daily ledgers, pushes cryptographically signed audit logs to Oracle central server, and prints physical Z-tape.</text>
    
  </g>
</svg>