<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/><stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="1000" height="650" fill="url(#bgGrad)"/>
  
  <!-- Terminal Top Bar -->
  <rect width="1000" height="52" fill="#2E0832"/>
  <circle cx="28" cy="26" r="8" fill="#A855F7"/>
  <text x="46" y="32" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="16" letter-spacing="1">PURPLE KEYS POS</text>
  <text x="500" y="32" fill="#E2E8F0" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="14" text-anchor="middle">SYSTEM ARCHITECTURE & ENTERPRISE DATA FLOW</text>
  <rect x="850" y="14" width="125" height="24" rx="12" fill="#10B981" fill-opacity="0.2"/>
  <circle cx="864" cy="26" r="4" fill="#10B981"/>
  <text x="876" y="31" fill="#10B981" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11">ONLINE • v2.0</text>

  <!-- Screen Body -->
  <g transform="translate(0, 52)">
    
    <rect x="60" y="35" width="880" height="130" rx="14" fill="#1E293B" stroke="#38BDF8" stroke-width="2" filter="url(#cardShadow)"/>
    <rect x="80" y="55" width="190" height="24" rx="6" fill="#0284C7"/>
    <text x="90" y="71" fill="#FFF" font-family="sans-serif" font-weight="800" font-size="12">PRESENTATION LAYER</text>
    <text x="80" y="112" fill="#FFFFFF" font-family="sans-serif" font-weight="800" font-size="20">Google Flutter 3 Multiplatform Engine</text>
    <text x="80" y="138" fill="#94A3B8" font-family="sans-serif" font-size="13">Windows POS Terminals • Waiter Android Tablets • iOS Handhelds • 60 FPS Smooth Touch</text>

    <!-- Flow Arrow 1 -->
    <path d="M 500 170 L 500 205" stroke="#38BDF8" stroke-width="3" stroke-dasharray="6,4"/>
    <polygon points="494,205 506,205 500,215" fill="#38BDF8"/>
    <text x="520" y="196" fill="#38BDF8" font-family="sans-serif" font-size="11" font-weight="700">BLoC / Cubit Reactive Streams</text>

    <rect x="60" y="220" width="880" height="130" rx="14" fill="#1E293B" stroke="#A855F7" stroke-width="2" filter="url(#cardShadow)"/>
    <rect x="80" y="240" width="220" height="24" rx="6" fill="#7C3AED"/>
    <text x="90" y="256" fill="#FFF" font-family="sans-serif" font-weight="800" font-size="12">DOMAIN & OFFLINE ENGINE</text>
    <text x="80" y="297" fill="#FFFFFF" font-family="sans-serif" font-weight="800" font-size="20">Clean Architecture & Local Hive NoSQL</text>
    <text x="80" y="323" fill="#C084FC" font-family="sans-serif" font-size="13">Sub-10ms Local Cache • Offline Order Queuing • TypeAdapter Serializers • Network Sentinel</text>

    <!-- Flow Arrow 2 -->
    <path d="M 500 355 L 500 390" stroke="#A855F7" stroke-width="3" stroke-dasharray="6,4"/>
    <polygon points="494,390 506,390 500,400" fill="#A855F7"/>
    <text x="520" y="381" fill="#A855F7" font-family="sans-serif" font-size="11" font-weight="700">Dio REST Client & SignalR WebSockets</text>

    <rect x="60" y="405" width="880" height="130" rx="14" fill="#1E293B" stroke="#10B981" stroke-width="2" filter="url(#cardShadow)"/>
    <rect x="80" y="425" width="220" height="24" rx="6" fill="#059669"/>
    <text x="90" y="441" fill="#FFF" font-family="sans-serif" font-weight="800" font-size="12">ENTERPRISE BACKEND & DB</text>
    <text x="80" y="482" fill="#FFFFFF" font-family="sans-serif" font-weight="800" font-size="20">ASP.NET Core Web API + Oracle / PostgreSQL</text>
    <text x="80" y="508" fill="#6EE7B7" font-family="sans-serif" font-size="13">High-Volume Fiscal Invoicing • BRBOT_COKTL Liquor Tables • Real-Time KDS Signal Dispatch</text>
    
  </g>
</svg>