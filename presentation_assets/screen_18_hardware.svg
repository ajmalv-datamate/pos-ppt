<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/><stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="1000" height="650" fill="url(#bgGrad)"/>
  
  <!-- Terminal Top Bar -->
  <rect width="1000" height="52" fill="#2E0832"/>
  <circle cx="28" cy="26" r="8" fill="#A855F7"/>
  <text x="46" y="32" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="16" letter-spacing="1">PURPLE KEYS POS</text>
  <text x="500" y="32" fill="#E2E8F0" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="14" text-anchor="middle">MULTI-PROTOCOL HARDWARE & THERMAL PRINTING</text>
  <rect x="850" y="14" width="125" height="24" rx="12" fill="#10B981" fill-opacity="0.2"/>
  <circle cx="864" cy="26" r="4" fill="#10B981"/>
  <text x="876" y="31" fill="#10B981" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11">ONLINE • v2.0</text>

  <!-- Screen Body -->
  <g transform="translate(0, 52)">
    
    <rect x="60" y="35" width="880" height="500" rx="16" fill="#1E293B" stroke="#334155" filter="url(#cardShadow)"/>
    <text x="95" y="75" fill="#FFFFFF" font-family="sans-serif" font-size="20" font-weight="800">HARDWARE ECOSYSTEM & PERIPHERAL INTEGRATION</text>
    <text x="95" y="100" fill="#94A3B8" font-family="sans-serif" font-size="13">High-speed ESC/POS driverless communication across thermal LAN, USB, Bluetooth, and cash drawers</text>

    <!-- 4 Hardware Cards -->
    <g transform="translate(95, 130)" font-family="sans-serif">
      <rect x="0" y="0" width="180" height="230" rx="12" fill="#0F172A" stroke="#38BDF8"/>
      <circle cx="90" cy="50" r="26" fill="#E0F2FE"/>
      <text x="80" y="58" font-size="22">🖨️</text>
      <text x="90" y="105" fill="#FFF" font-size="14" font-weight="800" text-anchor="middle">Kitchen LAN</text>
      <text x="90" y="125" fill="#38BDF8" font-size="11" font-weight="700" text-anchor="middle">IP: 192.168.1.101</text>
      <text x="90" y="155" fill="#94A3B8" font-size="11" text-anchor="middle">Heavy-duty 80mm</text>
      <text x="90" y="172" fill="#94A3B8" font-size="11" text-anchor="middle">Auto-cutter thermal</text>
      <rect x="25" y="190" width="130" height="24" rx="6" fill="#10B981" fill-opacity="0.2"/>
      <text x="90" y="206" fill="#4ADE80" font-size="10.5" font-weight="800" text-anchor="middle">CONNECTED ✓</text>

      <rect x="210" y="0" width="180" height="230" rx="12" fill="#0F172A" stroke="#A855F7"/>
      <circle cx="300" cy="50" r="26" fill="#F3E8FF"/>
      <text x="290" y="58" font-size="22">🍸</text>
      <text x="300" y="105" fill="#FFF" font-size="14" font-weight="800" text-anchor="middle">Bar Dispenser</text>
      <text x="300" y="125" fill="#C084FC" font-size="11" font-weight="700" text-anchor="middle">IP: 192.168.1.102</text>
      <text x="300" y="155" fill="#94A3B8" font-size="11" text-anchor="middle">Direct BOT ticket</text>
      <text x="300" y="172" fill="#94A3B8" font-size="11" text-anchor="middle">Peg recipe labels</text>
      <rect x="235" y="190" width="130" height="24" rx="6" fill="#10B981" fill-opacity="0.2"/>
      <text x="300" y="206" fill="#4ADE80" font-size="10.5" font-weight="800" text-anchor="middle">CONNECTED ✓</text>

      <rect x="420" y="0" width="180" height="230" rx="12" fill="#0F172A" stroke="#10B981"/>
      <circle cx="510" cy="50" r="26" fill="#DCFCE7"/>
      <text x="500" y="58" font-size="22">🧾</text>
      <text x="510" y="105" fill="#FFF" font-size="14" font-weight="800" text-anchor="middle">Cashier Desk</text>
      <text x="510" y="125" fill="#4ADE80" font-size="11" font-weight="700" text-anchor="middle">USB / Direct COM</text>
      <text x="510" y="155" fill="#94A3B8" font-size="11" text-anchor="middle">GST receipt print</text>
      <text x="510" y="172" fill="#94A3B8" font-size="11" text-anchor="middle">Sub-second output</text>
      <rect x="445" y="190" width="130" height="24" rx="6" fill="#10B981" fill-opacity="0.2"/>
      <text x="510" y="206" fill="#4ADE80" font-size="10.5" font-weight="800" text-anchor="middle">CONNECTED ✓</text>

      <rect x="630" y="0" width="180" height="230" rx="12" fill="#0F172A" stroke="#F59E0B"/>
      <circle cx="720" cy="50" r="26" fill="#FEF3C7"/>
      <text x="710" y="58" font-size="22">💵</text>
      <text x="720" y="105" fill="#FFF" font-size="14" font-weight="800" text-anchor="middle">Cash Drawer</text>
      <text x="720" y="125" fill="#FCD34D" font-size="11" font-weight="700" text-anchor="middle">RJ11 Kick Pulse</text>
      <text x="720" y="155" fill="#94A3B8" font-size="11" text-anchor="middle">Auto-eject on cash</text>
      <text x="720" y="172" fill="#94A3B8" font-size="11" text-anchor="middle">Security solenoid</text>
      <rect x="655" y="190" width="130" height="24" rx="6" fill="#10B981" fill-opacity="0.2"/>
      <text x="720" y="206" fill="#4ADE80" font-size="10.5" font-weight="800" text-anchor="middle">CONNECTED ✓</text>
    </g>

    <rect x="95" y="390" width="810" height="110" rx="12" fill="#0F172A" stroke="#334155"/>
    <text x="120" y="420" fill="#38BDF8" font-family="sans-serif" font-size="13" font-weight="800">REDUNDANT SPOOLING & AUTO-FAILOVER</text>
    <text x="120" y="445" fill="#94A3B8" font-family="sans-serif" font-size="12">If kitchen printer runs out of paper or encounters paper jam, print spooler automatically redirects the ticket to backup station and displays alert on waiter tablet.</text>
    
  </g>
</svg>