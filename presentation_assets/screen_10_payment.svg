<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/><stop offset="100%" stop-color="#EDF2F7"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="1000" height="650" fill="url(#bgGrad)"/>
  
  <!-- Terminal Top Bar -->
  <rect width="1000" height="52" fill="#2E0832"/>
  <circle cx="28" cy="26" r="8" fill="#A855F7"/>
  <text x="46" y="32" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="16" letter-spacing="1">PURPLE KEYS POS</text>
  <text x="500" y="32" fill="#E2E8F0" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="14" text-anchor="middle">MULTI-TENDER PAYMENT SETTLEMENT & TAX CLEARANCE</text>
  <rect x="850" y="14" width="125" height="24" rx="12" fill="#10B981" fill-opacity="0.2"/>
  <circle cx="864" cy="26" r="4" fill="#10B981"/>
  <text x="876" y="31" fill="#10B981" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11">ONLINE • v2.0</text>

  <!-- Screen Body -->
  <g transform="translate(0, 52)">
    
    <rect x="60" y="30" width="450" height="510" rx="16" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#cardShadow)"/>
    <text x="90" y="70" fill="#0F172A" font-family="sans-serif" font-size="18" font-weight="800">BILL SUMMARY • TABLE T-04</text>
    <text x="90" y="92" fill="#64748B" font-family="sans-serif" font-size="12">Invoice #INV-2026-9042 • 5 Items</text>

    <line x1="90" y1="115" x2="470" y2="115" stroke="#E2E8F0" stroke-width="1.5"/>

    <!-- Bill Items -->
    <g font-family="sans-serif" font-size="13" fill="#1E293B">
      <text x="90" y="145" font-weight="600">Janatha Brandy 4 Peg (240ml)</text>
      <text x="470" y="145" font-weight="700" text-anchor="end">₹1,200.00</text>

      <text x="90" y="180" font-weight="600">Oasis Rum 4 Peg (240ml)</text>
      <text x="470" y="180" font-weight="700" text-anchor="end">₹1,200.00</text>

      <text x="90" y="215" font-weight="600">Crispy Chicken Dry Fry</text>
      <text x="470" y="215" font-weight="700" text-anchor="end">₹380.00</text>

      <text x="90" y="250" font-weight="600">Salted Roasted Cashews</text>
      <text x="470" y="250" font-weight="700" text-anchor="end">₹180.00</text>
    </g>

    <line x1="90" y1="280" x2="470" y2="280" stroke="#E2E8F0" stroke-width="1.5"/>

    <!-- Calculations -->
    <g font-family="sans-serif" font-size="13" fill="#64748B">
      <text x="90" y="310">Subtotal Amount</text>
      <text x="470" y="310" text-anchor="end" font-weight="700" fill="#1E293B">₹2,960.00</text>

      <text x="90" y="338">VAT / Liquor Tax (10%)</text>
      <text x="470" y="338" text-anchor="end" font-weight="700" fill="#1E293B">₹240.00</text>

      <text x="90" y="366">GST (5% Food items)</text>
      <text x="470" y="366" text-anchor="end" font-weight="700" fill="#1E293B">₹28.00</text>

      <text x="90" y="394">Round Off</text>
      <text x="470" y="394" text-anchor="end" font-weight="700" fill="#1E293B">+₹0.00</text>
    </g>

    <rect x="85" y="420" width="390" height="55" rx="10" fill="#F3E8FF" stroke="#D8B4FE"/>
    <text x="105" y="454" fill="#6B21A8" font-family="sans-serif" font-size="14" font-weight="800">NET PAYABLE</text>
    <text x="455" y="456" fill="#6B21A8" font-family="sans-serif" font-size="24" font-weight="800" text-anchor="end">₹3,228.00</text>

    <!-- Tender Selection Right Column -->
    <rect x="540" y="30" width="400" height="510" rx="16" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#cardShadow)"/>
    <text x="570" y="70" fill="#0F172A" font-family="sans-serif" font-size="18" font-weight="800">SPLIT TENDER SETTLEMENT</text>
    <text x="570" y="92" fill="#64748B" font-family="sans-serif" font-size="12">Accept multiple payments simultaneously</text>

    <!-- Tender Buttons -->
    <g transform="translate(570, 115)" font-family="sans-serif" font-size="13" font-weight="700">
      <rect x="0" y="0" width="165" height="48" rx="8" fill="#ECFDF5" stroke="#A7F3D0"/>
      <text x="82" y="29" fill="#065F46" text-anchor="middle">💵 CASH: ₹1,228.00</text>

      <rect x="180" y="0" width="165" height="48" rx="8" fill="#EFF6FF" stroke="#BFDBFE"/>
      <text x="262" y="29" fill="#1E40AF" text-anchor="middle">💳 CARD: ₹2,000.00</text>

      <rect x="0" y="60" width="165" height="48" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="82" y="89" fill="#475569" text-anchor="middle">📱 UPI / QR</text>

      <rect x="180" y="60" width="165" height="48" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="262" y="89" fill="#475569" text-anchor="middle">🏨 ROOM LEDGER</text>
    </g>

    <!-- Settlement Balance -->
    <rect x="570" y="250" width="345" height="90" rx="12" fill="#F0FDF4" stroke="#BBF7D0"/>
    <text x="590" y="280" fill="#166534" font-family="sans-serif" font-size="12" font-weight="800">SETTLEMENT BALANCE</text>
    <text x="590" y="315" fill="#15803D" font-family="sans-serif" font-size="22" font-weight="800">Balanced: ₹0.00 Due</text>
    <circle cx="880" cy="295" r="16" fill="#22C55E"/>
    <text x="874" y="301" fill="#FFF" font-family="sans-serif" font-size="16" font-weight="800">✓</text>

    <!-- Final Settle Button -->
    <rect x="570" y="375" width="345" height="60" rx="12" fill="#7C3AED" filter="url(#cardShadow)"/>
    <text x="742" y="412" fill="#FFFFFF" font-family="sans-serif" font-size="17" font-weight="800" text-anchor="middle">SETTLE & PRINT RECEIPT 🖨️</text>

    <text x="570" y="475" fill="#64748B" font-family="sans-serif" font-size="11" font-weight="500">Auto-routes ESC/POS receipt to thermal LAN printer & releases table status in database.</text>
    
  </g>
</svg>