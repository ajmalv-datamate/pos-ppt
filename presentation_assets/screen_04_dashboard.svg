<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/><stop offset="100%" stop-color="#EDF2F7"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="1000" height="650" fill="url(#bgGrad)"/>
  
  <!-- Terminal Top Bar -->
  <rect width="1000" height="52" fill="#2E0832"/>
  <circle cx="28" cy="26" r="8" fill="#A855F7"/>
  <text x="46" y="32" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="16" letter-spacing="1">PURPLE KEYS POS</text>
  <text x="500" y="32" fill="#E2E8F0" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="14" text-anchor="middle">EXECUTIVE POS DASHBOARD & SPEED NAVIGATION</text>
  <rect x="850" y="14" width="125" height="24" rx="12" fill="#10B981" fill-opacity="0.2"/>
  <circle cx="864" cy="26" r="4" fill="#10B981"/>
  <text x="876" y="31" fill="#10B981" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11">ONLINE • v2.0</text>

  <!-- Screen Body -->
  <g transform="translate(0, 52)">
    
    <!-- KPI Row -->
    <rect x="40" y="20" width="210" height="100" rx="12" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#cardShadow)"/>
    <text x="60" y="50" fill="#64748B" font-family="sans-serif" font-size="12" font-weight="700">TODAY REVENUE</text>
    <text x="60" y="85" fill="#0F172A" font-family="sans-serif" font-size="24" font-weight="800">₹1,42,850</text>
    <text x="60" y="105" fill="#10B981" font-family="sans-serif" font-size="11" font-weight="700">▲ +14% vs yesterday</text>

    <rect x="275" y="20" width="210" height="100" rx="12" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#cardShadow)"/>
    <text x="295" y="50" fill="#64748B" font-family="sans-serif" font-size="12" font-weight="700">ACTIVE ORDERS</text>
    <text x="295" y="85" fill="#7C3AED" font-family="sans-serif" font-size="24" font-weight="800">28 Tables</text>
    <text x="295" y="105" fill="#64748B" font-family="sans-serif" font-size="11" font-weight="600">82% occupancy rate</text>

    <rect x="510" y="20" width="210" height="100" rx="12" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#cardShadow)"/>
    <text x="530" y="50" fill="#64748B" font-family="sans-serif" font-size="12" font-weight="700">KDS AVG SPEED</text>
    <text x="530" y="85" fill="#0284C7" font-family="sans-serif" font-size="24" font-weight="800">8.4 mins</text>
    <text x="530" y="105" fill="#10B981" font-family="sans-serif" font-size="11" font-weight="700">▼ -2.1 min prep time</text>

    <rect x="745" y="20" width="215" height="100" rx="12" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#cardShadow)"/>
    <text x="765" y="50" fill="#64748B" font-family="sans-serif" font-size="12" font-weight="700">OFFLINE QUEUE</text>
    <text x="765" y="85" fill="#059669" font-family="sans-serif" font-size="24" font-weight="800">Synced</text>
    <text x="765" y="105" fill="#059669" font-family="sans-serif" font-size="11" font-weight="700">0 pending transactions</text>

    <!-- Quick Navigation Modules -->
    <text x="40" y="155" fill="#0F172A" font-family="sans-serif" font-size="16" font-weight="800">OPERATIONAL MODULE SHORTCUTS</text>
    <g font-family="sans-serif" font-weight="700" font-size="14" fill="#0F172A">
      <rect x="40" y="175" width="210" height="160" rx="12" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#cardShadow)"/>
      <circle cx="80" cy="220" r="24" fill="#F3E8FF"/>
      <text x="72" y="227" font-size="20">🍽️</text>
      <text x="60" y="275" font-size="16" font-weight="800">Floor Dining</text>
      <text x="60" y="300" fill="#64748B" font-size="11" font-weight="500">Live 40 table layout</text>

      <rect x="275" y="175" width="210" height="160" rx="12" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#cardShadow)"/>
      <circle cx="315" cy="220" r="24" fill="#E0F2FE"/>
      <text x="307" y="227" font-size="20">⚡</text>
      <text x="295" y="275" font-size="16" font-weight="800">Direct Billing</text>
      <text x="295" y="300" fill="#64748B" font-size="11" font-weight="500">Sub-second counter POS</text>

      <rect x="510" y="175" width="210" height="160" rx="12" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#cardShadow)"/>
      <circle cx="550" cy="220" r="24" fill="#DCFCE7"/>
      <text x="542" y="227" font-size="20">🍸</text>
      <text x="530" y="275" font-size="16" font-weight="800">Cocktail Hub</text>
      <text x="530" y="300" fill="#64748B" font-size="11" font-weight="500">Recipe substitute engine</text>

      <rect x="745" y="175" width="215" height="160" rx="12" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#cardShadow)"/>
      <circle cx="785" cy="220" r="24" fill="#FEF3C7"/>
      <text x="777" y="227" font-size="20">📊</text>
      <text x="765" y="275" font-size="16" font-weight="800">Z-Closeout</text>
      <text x="765" y="300" fill="#64748B" font-size="11" font-weight="500">End-of-day register audit</text>
    </g>

    <!-- Recent Order Log Strip -->
    <rect x="40" y="360" width="920" height="200" rx="14" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#cardShadow)"/>
    <text x="65" y="395" fill="#0F172A" font-family="sans-serif" font-size="15" font-weight="800">ACTIVE SHIFT REGISTER & REAL-TIME ALERTS</text>
    <rect x="65" y="415" width="870" height="38" rx="8" fill="#F8FAFC"/>
    <text x="85" y="439" fill="#1E293B" font-family="sans-serif" font-size="12" font-weight="700">Table T-08 (Banquet Hall) • Order #4082 • 4 items • Billed: ₹2,450.00 • Waiter: Rahul M.</text>
    <rect x="65" y="460" width="870" height="38" rx="8" fill="#F8FAFC"/>
    <text x="85" y="484" fill="#1E293B" font-family="sans-serif" font-size="12" font-weight="700">Table T-14 (A/C Lounge) • Order #4081 • 6 items • In Kitchen (KOT Dispatched) • 06:12 elapsed</text>
    <rect x="65" y="505" width="870" height="38" rx="8" fill="#F8FAFC"/>
    <text x="85" y="529" fill="#1E293B" font-family="sans-serif" font-size="12" font-weight="700">SignalR Hub: Synchronized with Oracle Enterprise Server (14 POS nodes connected)</text>
    
  </g>
</svg>