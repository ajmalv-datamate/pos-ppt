<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/><stop offset="100%" stop-color="#EDF2F7"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="1000" height="650" fill="url(#bgGrad)"/>
  
  <!-- Terminal Top Bar -->
  <rect width="1000" height="52" fill="#2E0832"/>
  <circle cx="28" cy="26" r="8" fill="#A855F7"/>
  <text x="46" y="32" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="16" letter-spacing="1">PURPLE KEYS POS</text>
  <text x="500" y="32" fill="#E2E8F0" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="14" text-anchor="middle">COMPLETED BILL ARCHIVE & LINE ITEM VOID AUDIT</text>
  <rect x="850" y="14" width="125" height="24" rx="12" fill="#10B981" fill-opacity="0.2"/>
  <circle cx="864" cy="26" r="4" fill="#10B981"/>
  <text x="876" y="31" fill="#10B981" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11">ONLINE • v2.0</text>

  <!-- Screen Body -->
  <g transform="translate(0, 52)">
    
    <rect x="60" y="30" width="880" height="510" rx="16" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#cardShadow)"/>
    <text x="95" y="70" fill="#0F172A" font-family="sans-serif" font-size="18" font-weight="800">TRANSACTION AUDIT LOG & BILL REPRINT REGISTER</text>
    <text x="95" y="92" fill="#64748B" font-family="sans-serif" font-size="12">Immutable ledger of settled bills, manager void justifications, and discount authorizations</text>

    <rect x="95" y="115" width="810" height="38" rx="8" fill="#F1F5F9"/>
    <text x="115" y="139" fill="#475569" font-family="sans-serif" font-size="12" font-weight="800">BILL NO</text>
    <text x="235" y="139" fill="#475569" font-family="sans-serif" font-size="12" font-weight="800">TIME</text>
    <text x="325" y="139" fill="#475569" font-family="sans-serif" font-size="12" font-weight="800">TABLE</text>
    <text x="425" y="139" fill="#475569" font-family="sans-serif" font-size="12" font-weight="800">WAITER</text>
    <text x="545" y="139" fill="#475569" font-family="sans-serif" font-size="12" font-weight="800">TENDER</text>
    <text x="675" y="139" fill="#475569" font-family="sans-serif" font-size="12" font-weight="800">STATUS</text>
    <text x="880" y="139" fill="#475569" font-family="sans-serif" font-size="12" font-weight="800" text-anchor="end">AMOUNT</text>

    <!-- Bill Rows -->
    <g transform="translate(95, 175)" font-family="sans-serif" font-size="13">
      <text x="20" y="0" font-weight="800" fill="#7C3AED">#INV-9041</text>
      <text x="140" y="0" fill="#64748B">21:42</text>
      <text x="230" y="0" font-weight="700">T-04</text>
      <text x="330" y="0">Rahul M.</text>
      <text x="450" y="0">Cash + Card</text>
      <rect x="560" y="-14" width="75" height="22" rx="4" fill="#DCFCE7"/>
      <text x="597" y="2" fill="#166534" font-weight="800" font-size="11" text-anchor="middle">SETTLED</text>
      <text x="785" y="0" font-weight="800" text-anchor="end">₹3,228.00</text>

      <line x1="0" y1="20" x2="810" y2="20" stroke="#F1F5F9"/>

      <text x="20" y="45" font-weight="800" fill="#7C3AED">#INV-9040</text>
      <text x="140" y="45" fill="#64748B">21:28</text>
      <text x="230" y="45" font-weight="700">T-12</text>
      <text x="330" y="45">Suresh K.</text>
      <text x="450" y="45">UPI QR</text>
      <rect x="560" y="31" width="75" height="22" rx="4" fill="#DCFCE7"/>
      <text x="597" y="47" fill="#166534" font-weight="800" font-size="11" text-anchor="middle">SETTLED</text>
      <text x="785" y="45" font-weight="800" text-anchor="end">₹1,850.00</text>

      <line x1="0" y1="65" x2="810" y2="65" stroke="#F1F5F9"/>

      <text x="20" y="90" font-weight="800" fill="#DC2626">#VOID-003</text>
      <text x="140" y="90" fill="#64748B">20:55</text>
      <text x="230" y="90" font-weight="700">T-08</text>
      <text x="330" y="90">Amit P.</text>
      <text x="450" y="90">Mgr Auth #99</text>
      <rect x="560" y="76" width="75" height="22" rx="4" fill="#FEE2E2"/>
      <text x="597" y="92" fill="#DC2626" font-weight="800" font-size="11" text-anchor="middle">VOID ITEM</text>
      <text x="785" y="90" font-weight="800" fill="#DC2626" text-anchor="end">₹600.00 (VOID)</text>
    </g>

    <!-- Manager Void Justification Box -->
    <rect x="95" y="310" width="810" height="110" rx="12" fill="#FEF2F2" stroke="#FECACA"/>
    <text x="120" y="340" fill="#991B1B" font-family="sans-serif" font-size="13" font-weight="800">SECURITY AUDIT DETAIL: VOID AUTHORIZATION</text>
    <text x="120" y="365" fill="#7F1D1D" font-family="sans-serif" font-size="12">Void Line: 1x Janatha 4 Peg Brandy • Reason: Guest changed preference to Premium Scotch • Authorized By: Shift Manager (PIN #9924)</text>
    <text x="120" y="390" fill="#7F1D1D" font-family="sans-serif" font-size="12">Security Enforcement: No cashier can delete an active KOT/BOT or void items without secondary Manager PIN authentication.</text>

    <rect x="95" y="445" width="220" height="45" rx="8" fill="#7C3AED"/>
    <text x="205" y="473" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="800" text-anchor="middle">REPRINT BILL 🖨️</text>

    <rect x="335" y="445" width="220" height="45" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="445" y="473" fill="#334155" font-family="sans-serif" font-size="13" font-weight="800" text-anchor="middle">EXPORT AUDIT XLS 📥</text>
    
  </g>
</svg>