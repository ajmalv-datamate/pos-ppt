<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9"/><stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="1000" height="650" fill="url(#bgGrad)"/>
  
  <!-- Terminal Top Bar -->
  <rect width="1000" height="52" fill="#2E0832"/>
  <circle cx="28" cy="26" r="8" fill="#A855F7"/>
  <text x="46" y="32" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="16" letter-spacing="1">PURPLE KEYS POS</text>
  <text x="500" y="32" fill="#E2E8F0" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="14" text-anchor="middle">INTERACTIVE TABLE FLOOR GRID & GUEST STATUS</text>
  <rect x="850" y="14" width="125" height="24" rx="12" fill="#10B981" fill-opacity="0.2"/>
  <circle cx="864" cy="26" r="4" fill="#10B981"/>
  <text x="876" y="31" fill="#10B981" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11">ONLINE • v2.0</text>

  <!-- Screen Body -->
  <g transform="translate(0, 52)">
    
    <!-- Legend -->
    <rect x="50" y="20" width="900" height="42" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
    <circle cx="80" cy="41" r="7" fill="#10B981"/>
    <text x="95" y="45" font-family="sans-serif" font-size="12" font-weight="700" fill="#334155">VACANT (18)</text>
    <circle cx="230" cy="41" r="7" fill="#EF4444"/>
    <text x="245" y="45" font-family="sans-serif" font-size="12" font-weight="700" fill="#334155">OCCUPIED (12)</text>
    <circle cx="400" cy="41" r="7" fill="#3B82F6"/>
    <text x="415" y="45" font-family="sans-serif" font-size="12" font-weight="700" fill="#334155">BILLED (4)</text>
    <circle cx="540" cy="41" r="7" fill="#F59E0B"/>
    <text x="555" y="45" font-family="sans-serif" font-size="12" font-weight="700" fill="#334155">RESERVED (6)</text>
    <text x="750" y="45" font-family="sans-serif" font-size="12" font-weight="800" fill="#7C3AED">TOTAL: 40 TABLES</text>

    <!-- Floor Grid Tables -->
    <g font-family="sans-serif" font-weight="800" text-anchor="middle">
      <!-- Row 1 -->
      <rect x="50" y="85" width="150" height="130" rx="14" fill="#FFFFFF" stroke="#EF4444" stroke-width="3" filter="url(#cardShadow)"/>
      <text x="125" y="125" fill="#EF4444" font-size="22">T-01</text>
      <text x="125" y="150" fill="#64748B" font-size="12" font-weight="600">4 Guests • 32m</text>
      <rect x="70" y="165" width="110" height="26" rx="6" fill="#FEE2E2"/>
      <text x="125" y="182" fill="#DC2626" font-size="11">₹2,840 (OCC)</text>

      <rect x="235" y="85" width="150" height="130" rx="14" fill="#FFFFFF" stroke="#10B981" stroke-width="3" filter="url(#cardShadow)"/>
      <text x="310" y="125" fill="#10B981" font-size="22">T-02</text>
      <text x="310" y="150" fill="#64748B" font-size="12" font-weight="600">2 Seats</text>
      <rect x="255" y="165" width="110" height="26" rx="6" fill="#DCFCE7"/>
      <text x="310" y="182" fill="#16A34A" font-size="11">AVAILABLE</text>

      <rect x="420" y="85" width="150" height="130" rx="14" fill="#FFFFFF" stroke="#3B82F6" stroke-width="3" filter="url(#cardShadow)"/>
      <text x="495" y="125" fill="#3B82F6" font-size="22">T-03</text>
      <text x="495" y="150" fill="#64748B" font-size="12" font-weight="600">6 Guests • Billed</text>
      <rect x="440" y="165" width="110" height="26" rx="6" fill="#DBEAFE"/>
      <text x="495" y="182" fill="#2563EB" font-size="11">₹5,120.00</text>

      <rect x="605" y="85" width="150" height="130" rx="14" fill="#FFFFFF" stroke="#F59E0B" stroke-width="3" filter="url(#cardShadow)"/>
      <text x="680" y="125" fill="#F59E0B" font-size="22">T-04</text>
      <text x="680" y="150" fill="#64748B" font-size="12" font-weight="600">Reserved 8:00PM</text>
      <rect x="625" y="165" width="110" height="26" rx="6" fill="#FEF3C7"/>
      <text x="680" y="182" fill="#D97706" font-size="11">MR. VERMA</text>

      <rect x="790" y="85" width="150" height="130" rx="14" fill="#FFFFFF" stroke="#10B981" stroke-width="3" filter="url(#cardShadow)"/>
      <text x="865" y="125" fill="#10B981" font-size="22">T-05</text>
      <text x="865" y="150" fill="#64748B" font-size="12" font-weight="600">4 Seats</text>
      <rect x="810" y="165" width="110" height="26" rx="6" fill="#DCFCE7"/>
      <text x="865" y="182" fill="#16A34A" font-size="11">AVAILABLE</text>

      <!-- Row 2 -->
      <rect x="50" y="240" width="150" height="130" rx="14" fill="#FFFFFF" stroke="#EF4444" stroke-width="3" filter="url(#cardShadow)"/>
      <text x="125" y="280" fill="#EF4444" font-size="22">T-06</text>
      <text x="125" y="305" fill="#64748B" font-size="12" font-weight="600">2 Guests • 18m</text>
      <rect x="70" y="320" width="110" height="26" rx="6" fill="#FEE2E2"/>
      <text x="125" y="337" fill="#DC2626" font-size="11">₹1,450 (OCC)</text>

      <rect x="235" y="240" width="150" height="130" rx="14" fill="#FFFFFF" stroke="#EF4444" stroke-width="3" filter="url(#cardShadow)"/>
      <text x="310" y="280" fill="#EF4444" font-size="22">T-07</text>
      <text x="310" y="305" fill="#64748B" font-size="12" font-weight="600">8 Guests • VIP</text>
      <rect x="255" y="320" width="110" height="26" rx="6" fill="#FEE2E2"/>
      <text x="310" y="337" fill="#DC2626" font-size="11">₹8,920 (OCC)</text>

      <rect x="420" y="240" width="150" height="130" rx="14" fill="#FFFFFF" stroke="#10B981" stroke-width="3" filter="url(#cardShadow)"/>
      <text x="495" y="280" fill="#10B981" font-size="22">T-08</text>
      <text x="495" y="305" fill="#64748B" font-size="12" font-weight="600">4 Seats</text>
      <rect x="440" y="320" width="110" height="26" rx="6" fill="#DCFCE7"/>
      <text x="495" y="337" fill="#16A34A" font-size="11">AVAILABLE</text>

      <rect x="605" y="240" width="150" height="130" rx="14" fill="#FFFFFF" stroke="#10B981" stroke-width="3" filter="url(#cardShadow)"/>
      <text x="680" y="280" fill="#10B981" font-size="22">T-09</text>
      <text x="680" y="305" fill="#64748B" font-size="12" font-weight="600">6 Seats</text>
      <rect x="625" y="320" width="110" height="26" rx="6" fill="#DCFCE7"/>
      <text x="680" y="337" fill="#16A34A" font-size="11">AVAILABLE</text>

      <rect x="790" y="240" width="150" height="130" rx="14" fill="#FFFFFF" stroke="#EF4444" stroke-width="3" filter="url(#cardShadow)"/>
      <text x="865" y="280" fill="#EF4444" font-size="22">T-10</text>
      <text x="865" y="305" fill="#64748B" font-size="12" font-weight="600">4 Guests</text>
      <rect x="810" y="320" width="110" height="26" rx="6" fill="#FEE2E2"/>
      <text x="865" y="337" fill="#DC2626" font-size="11">₹3,210 (OCC)</text>
    </g>

    <!-- Bottom Action Ribbon -->
    <rect x="50" y="400" width="900" height="150" rx="14" fill="#FFFFFF" stroke="#CBD5E1" filter="url(#cardShadow)"/>
    <text x="80" y="435" fill="#0F172A" font-family="sans-serif" font-size="15" font-weight="800">TABLE CONTROLS & FAST ACTIONS</text>
    <g transform="translate(80, 455)" font-family="sans-serif" font-size="12" font-weight="700">
      <rect x="0" y="0" width="190" height="42" rx="8" fill="#7C3AED"/>
      <text x="95" y="26" fill="#FFF" text-anchor="middle">⚡ Open Direct Order (T-01)</text>

      <rect x="210" y="0" width="170" height="42" rx="8" fill="#F1F5F9" stroke="#CBD5E1"/>
      <text x="295" y="26" fill="#334155" text-anchor="middle">🔄 Transfer / Merge Table</text>

      <rect x="400" y="0" width="160" height="42" rx="8" fill="#F1F5F9" stroke="#CBD5E1"/>
      <text x="480" y="26" fill="#334155" text-anchor="middle">💳 Settle & Generate Bill</text>

      <rect x="580" y="0" width="160" height="42" rx="8" fill="#F1F5F9" stroke="#CBD5E1"/>
      <text x="660" y="26" fill="#334155" text-anchor="middle">🖨️ Reprint KOT / BOT</text>
    </g>
    <text x="80" y="525" fill="#64748B" font-family="sans-serif" font-size="11" font-weight="500">Color-coded floor layout supports real-time multi-terminal state synchronization over SignalR WebSocket bus.</text>
    
  </g>
</svg>