<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9"/><stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="1000" height="650" fill="url(#bgGrad)"/>
  
  <!-- Terminal Top Bar -->
  <rect width="1000" height="52" fill="#2E0832"/>
  <circle cx="28" cy="26" r="8" fill="#A855F7"/>
  <text x="46" y="32" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="16" letter-spacing="1">PURPLE KEYS POS</text>
  <text x="500" y="32" fill="#E2E8F0" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="14" text-anchor="middle">FLEXIBLE BILL SPLITTING ENGINE (SEAT & ITEM LEVEL)</text>
  <rect x="850" y="14" width="125" height="24" rx="12" fill="#10B981" fill-opacity="0.2"/>
  <circle cx="864" cy="26" r="4" fill="#10B981"/>
  <text x="876" y="31" fill="#10B981" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11">ONLINE • v2.0</text>

  <!-- Screen Body -->
  <g transform="translate(0, 52)">
    
    <rect x="50" y="25" width="900" height="520" rx="16" fill="#FFFFFF" stroke="#CBD5E1" filter="url(#cardShadow)"/>
    <text x="80" y="65" fill="#0F172A" font-family="sans-serif" font-size="18" font-weight="800">SPLIT ORDER • TABLE T-12 (TOTAL: ₹4,800.00)</text>
    <text x="80" y="88" fill="#64748B" font-family="sans-serif" font-size="12">Divide check equally, item-by-item, or seat-by-seat with dedicated fiscal invoices.</text>

    <!-- Split Columns -->
    <g font-family="sans-serif">
      <!-- Sub-Bill 1 -->
      <rect x="80" y="115" width="260" height="350" rx="12" fill="#F8FAFC" stroke="#7C3AED" stroke-width="2"/>
      <rect x="80" y="115" width="260" height="36" rx="12" fill="#7C3AED"/>
      <text x="210" y="138" fill="#FFFFFF" font-weight="800" font-size="13" text-anchor="middle">SUB-BILL 01 (SEAT 1 & 2)</text>
      <g font-size="12" fill="#334155" transform="translate(100, 175)">
        <text y="0">• Janatha Brandy 4 Peg</text>
        <text y="20" font-weight="700" fill="#7C3AED">₹600.00</text>
        <text y="50">• Pepper Chicken Fry</text>
        <text y="70" font-weight="700" fill="#7C3AED">₹380.00</text>
        <text y="100">• Mineral Water 1L</text>
        <text y="120" font-weight="700" fill="#7C3AED">₹40.00</text>
        <line x1="-5" y1="145" x2="225" y2="145" stroke="#CBD5E1"/>
        <text y="170" font-weight="800" font-size="15" fill="#0F172A">Total: ₹1,020.00</text>
      </g>
      <rect x="100" y="400" width="220" height="38" rx="8" fill="#7C3AED"/>
      <text x="210" y="424" fill="#FFFFFF" font-weight="800" font-size="12" text-anchor="middle">Pay Sub-Bill 01 💳</text>

      <!-- Sub-Bill 2 -->
      <rect x="370" y="115" width="260" height="350" rx="12" fill="#F8FAFC" stroke="#0284C7" stroke-width="2"/>
      <rect x="370" y="115" width="260" height="36" rx="12" fill="#0284C7"/>
      <text x="500" y="138" fill="#FFFFFF" font-weight="800" font-size="13" text-anchor="middle">SUB-BILL 02 (SEAT 3)</text>
      <g font-size="12" fill="#334155" transform="translate(390, 175)">
        <text y="0">• Oasis Rum 4 Peg</text>
        <text y="20" font-weight="700" fill="#0284C7">₹600.00</text>
        <text y="50">• Butter Naan (2 pcs)</text>
        <text y="70" font-weight="700" fill="#0284C7">₹120.00</text>
        <text y="100">• Kadai Chicken Curry</text>
        <text y="120" font-weight="700" fill="#0284C7">₹420.00</text>
        <line x1="-5" y1="145" x2="225" y2="145" stroke="#CBD5E1"/>
        <text y="170" font-weight="800" font-size="15" fill="#0F172A">Total: ₹1,140.00</text>
      </g>
      <rect x="390" y="400" width="220" height="38" rx="8" fill="#0284C7"/>
      <text x="500" y="424" fill="#FFFFFF" font-weight="800" font-size="12" text-anchor="middle">Pay Sub-Bill 02 💳</text>

      <!-- Sub-Bill 3 -->
      <rect x="660" y="115" width="260" height="350" rx="12" fill="#F8FAFC" stroke="#059669" stroke-width="2"/>
      <rect x="660" y="115" width="260" height="36" rx="12" fill="#059669"/>
      <text x="790" y="138" fill="#FFFFFF" font-weight="800" font-size="13" text-anchor="middle">SUB-BILL 03 (SHARED REMAINDER)</text>
      <g font-size="12" fill="#334155" transform="translate(680, 175)">
        <text y="0">• Special Mixed Tandoori Platter</text>
        <text y="20" font-weight="700" fill="#059669">₹1,800.00</text>
        <text y="50">• Mocktails & Desserts</text>
        <text y="70" font-weight="700" fill="#059669">₹840.00</text>
        <line x1="-5" y1="145" x2="225" y2="145" stroke="#CBD5E1"/>
        <text y="170" font-weight="800" font-size="15" fill="#0F172A">Total: ₹2,640.00</text>
      </g>
      <rect x="680" y="400" width="220" height="38" rx="8" fill="#059669"/>
      <text x="790" y="424" fill="#FFFFFF" font-weight="800" font-size="12" text-anchor="middle">Pay Sub-Bill 03 💳</text>
    </g>

    <text x="80" y="495" fill="#64748B" font-family="sans-serif" font-size="11.5" font-weight="600">Guarantees zero rounding leakage: sum of split tax calculations mathematically matches the parent fiscal invoice.</text>
    
  </g>
</svg>