<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E0832"/><stop offset="100%" stop-color="#4A154B"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="1000" height="650" fill="url(#bgGrad)"/>
  
  <!-- Terminal Top Bar -->
  <rect width="1000" height="52" fill="#2E0832"/>
  <circle cx="28" cy="26" r="8" fill="#A855F7"/>
  <text x="46" y="32" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="16" letter-spacing="1">PURPLE KEYS POS</text>
  <text x="500" y="32" fill="#E2E8F0" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="14" text-anchor="middle">RBAC SECURITY & MANAGER OVERRIDE PERMISSIONS</text>
  <rect x="850" y="14" width="125" height="24" rx="12" fill="#10B981" fill-opacity="0.2"/>
  <circle cx="864" cy="26" r="4" fill="#10B981"/>
  <text x="876" y="31" fill="#10B981" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11">ONLINE • v2.0</text>

  <!-- Screen Body -->
  <g transform="translate(0, 52)">
    
    <rect x="60" y="35" width="880" height="500" rx="16" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#cardShadow)"/>
    <text x="95" y="75" fill="#0F172A" font-family="sans-serif" font-size="20" font-weight="800">ENTERPRISE ROLE-BASED ACCESS CONTROL (RBAC)</text>
    <text x="95" y="100" fill="#64748B" font-family="sans-serif" font-size="13">Granular privilege tiers enforcing strict financial compliance and fraud elimination</text>

    <!-- Role Columns -->
    <g transform="translate(95, 130)" font-family="sans-serif">
      <!-- Role 1: Waiter -->
      <rect x="0" y="0" width="250" height="240" rx="12" fill="#F8FAFC" stroke="#CBD5E1"/>
      <rect x="0" y="0" width="250" height="36" rx="12" fill="#64748B"/>
      <text x="125" y="23" fill="#FFF" font-weight="800" font-size="13" text-anchor="middle">ROLE 1: CAPTAIN / WAITER</text>
      <g transform="translate(20, 65)" font-size="12" fill="#334155">
        <text y="0">✓ Take orders & fire KOT/BOT</text>
        <text y="28">✓ Modify guest item counts</text>
        <text y="56">✓ View floor table occupancy</text>
        <text y="84" fill="#DC2626" font-weight="700">✗ Cannot apply discounts</text>
        <text y="112" fill="#DC2626" font-weight="700">✗ Cannot void active bills</text>
        <text y="140" fill="#DC2626" font-weight="700">✗ Cannot close shift register</text>
      </g>

      <!-- Role 2: Cashier -->
      <rect x="280" y="0" width="250" height="240" rx="12" fill="#F8FAFC" stroke="#0284C7"/>
      <rect x="280" y="0" width="250" height="36" rx="12" fill="#0284C7"/>
      <text x="405" y="23" fill="#FFF" font-weight="800" font-size="13" text-anchor="middle">ROLE 2: CASHIER OPERATOR</text>
      <g transform="translate(300, 65)" font-size="12" fill="#334155">
        <text y="0">✓ Settle multi-tender payments</text>
        <text y="28">✓ Print official fiscal invoices</text>
        <text y="56">✓ Split checks (seat/item level)</text>
        <text y="84">✓ Perform petty cash drops</text>
        <text y="112" fill="#DC2626" font-weight="700">✗ Cannot edit menu pricing</text>
        <text y="140" fill="#DC2626" font-weight="700">✗ Void requires Manager PIN</text>
      </g>

      <!-- Role 3: Shift Manager -->
      <rect x="560" y="0" width="250" height="240" rx="12" fill="#F8FAFC" stroke="#7C3AED"/>
      <rect x="560" y="0" width="250" height="36" rx="12" fill="#7C3AED"/>
      <text x="685" y="23" fill="#FFF" font-weight="800" font-size="13" text-anchor="middle">ROLE 3: SHIFT MANAGER / ADMIN</text>
      <g transform="translate(580, 65)" font-size="12" fill="#334155">
        <text y="0">✓ Full financial override rights</text>
        <text y="28">✓ 2FA PIN authorization for voids</text>
        <text y="56">✓ Custom discount approvals</text>
        <text y="84">✓ Close daily fiscal Z-report</text>
        <text y="112">✓ Access executive audit logs</text>
        <text y="140">✓ Manage terminal assignments</text>
      </g>
    </g>

    <rect x="95" y="395" width="810" height="100" rx="12" fill="#F3E8FF" stroke="#D8B4FE"/>
    <text x="120" y="425" fill="#6B21A8" font-family="sans-serif" font-size="13" font-weight="800">AUTOMATIC 30-MINUTE INACTIVITY SECURITY GUARD</text>
    <text x="120" y="450" fill="#581C87" font-family="sans-serif" font-size="12">If an operator leaves a POS terminal unattended, the terminal locks within 30 minutes, masking all customer data and requiring immediate PIN entry before orders can resume.</text>
    
  </g>
</svg>