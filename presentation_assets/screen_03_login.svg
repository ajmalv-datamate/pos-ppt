<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D0B33"/><stop offset="100%" stop-color="#4A154B"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="1000" height="650" fill="url(#bgGrad)"/>
  
  <!-- Terminal Top Bar -->
  <rect width="1000" height="52" fill="#2E0832"/>
  <circle cx="28" cy="26" r="8" fill="#A855F7"/>
  <text x="46" y="32" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="16" letter-spacing="1">PURPLE KEYS POS</text>
  <text x="500" y="32" fill="#E2E8F0" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="14" text-anchor="middle">OPERATOR PIN AUTHENTICATION & SECURITY GUARD</text>
  <rect x="850" y="14" width="125" height="24" rx="12" fill="#10B981" fill-opacity="0.2"/>
  <circle cx="864" cy="26" r="4" fill="#10B981"/>
  <text x="876" y="31" fill="#10B981" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11">ONLINE • v2.0</text>

  <!-- Screen Body -->
  <g transform="translate(0, 52)">
    
    <rect x="290" y="35" width="420" height="520" rx="20" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <!-- Avatar -->
    <circle cx="500" cy="100" r="40" fill="#F3E8FF"/>
    <circle cx="500" cy="92" r="16" fill="#7C3AED"/>
    <path d="M 478 122 C 478 110, 522 110, 522 122" fill="#7C3AED"/>

    <text x="500" y="165" fill="#1E293B" font-family="sans-serif" font-weight="800" font-size="20" text-anchor="middle">Terminal 01 - Cashier Desk</text>
    <text x="500" y="188" fill="#64748B" font-family="sans-serif" font-weight="500" font-size="13" text-anchor="middle">Enter 4-Digit Operator Security PIN</text>

    <!-- PIN Dots -->
    <circle cx="440" cy="225" r="10" fill="#7C3AED"/>
    <circle cx="480" cy="225" r="10" fill="#7C3AED"/>
    <circle cx="520" cy="225" r="10" fill="#7C3AED"/>
    <circle cx="560" cy="225" r="10" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="2"/>

    <!-- Keypad Grid -->
    <g transform="translate(340, 260)" font-family="sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#1E293B">
      <!-- Row 1 -->
      <rect x="0" y="0" width="90" height="55" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="45" y="35">1</text>
      <rect x="115" y="0" width="90" height="55" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="160" y="35">2</text>
      <rect x="230" y="0" width="90" height="55" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="275" y="35">3</text>

      <!-- Row 2 -->
      <rect x="0" y="65" width="90" height="55" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="45" y="100">4</text>
      <rect x="115" y="65" width="90" height="55" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="160" y="100">5</text>
      <rect x="230" y="65" width="90" height="55" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="275" y="100">6</text>

      <!-- Row 3 -->
      <rect x="0" y="130" width="90" height="55" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="45" y="165">7</text>
      <rect x="115" y="130" width="90" height="55" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="160" y="165">8</text>
      <rect x="230" y="130" width="90" height="55" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="275" y="165">9</text>

      <!-- Row 4 -->
      <rect x="0" y="195" width="90" height="55" rx="10" fill="#FEE2E2" stroke="#FECACA"/>
      <text x="45" y="230" fill="#DC2626" font-size="14">CLEAR</text>
      <rect x="115" y="195" width="90" height="55" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="160" y="230">0</text>
      <rect x="230" y="195" width="90" height="55" rx="10" fill="#7C3AED"/>
      <text x="275" y="230" fill="#FFFFFF" font-size="15">OK</text>
    </g>

    <!-- Inactivity Guard Banner -->
    <rect x="340" y="520" width="320" height="24" rx="6" fill="#F1F5F9"/>
    <text x="500" y="536" fill="#475569" font-family="sans-serif" font-weight="700" font-size="10.5" text-anchor="middle">🔒 Automatic 30-Minute Inactivity Screen Lock Guard</text>
    
  </g>
</svg>