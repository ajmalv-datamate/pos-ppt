<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9"/><stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="1000" height="650" fill="url(#bgGrad)"/>
  
  <!-- Terminal Top Bar -->
  <rect width="1000" height="52" fill="#2E0832"/>
  <circle cx="28" cy="26" r="8" fill="#A855F7"/>
  <text x="46" y="32" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="16" letter-spacing="1">PURPLE KEYS POS</text>
  <text x="500" y="32" fill="#E2E8F0" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="14" text-anchor="middle">TABLE TRANSFER, MERGE & WAITER SHIFT HANDOVER</text>
  <rect x="850" y="14" width="125" height="24" rx="12" fill="#10B981" fill-opacity="0.2"/>
  <circle cx="864" cy="26" r="4" fill="#10B981"/>
  <text x="876" y="31" fill="#10B981" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11">ONLINE • v2.0</text>

  <!-- Screen Body -->
  <g transform="translate(0, 52)">
    
    <rect x="60" y="35" width="880" height="500" rx="16" fill="#FFFFFF" stroke="#CBD5E1" filter="url(#cardShadow)"/>
    <text x="95" y="75" fill="#0F172A" font-family="sans-serif" font-size="20" font-weight="800">SEAMLESS INTER-TABLE ORDER TRANSFERS & MERGES</text>
    <text x="95" y="100" fill="#64748B" font-family="sans-serif" font-size="13">Instantly shift active orders or merge tables when guests move seats without losing bill history.</text>

    <!-- Source Table -->
    <rect x="95" y="140" width="340" height="240" rx="14" fill="#F8FAFC" stroke="#EF4444" stroke-width="2"/>
    <rect x="95" y="140" width="340" height="36" rx="14" fill="#EF4444"/>
    <text x="265" y="163" fill="#FFF" font-family="sans-serif" font-weight="800" font-size="13" text-anchor="middle">SOURCE: TABLE T-02 (A/C HALL)</text>
    <g transform="translate(115, 205)" font-family="sans-serif" font-size="13" fill="#334155">
      <text y="0" font-weight="700">• 2x Janatha Brandy 4 Peg</text>
      <text y="28" font-weight="700">• 1x Crispy Calamari Rings</text>
      <text y="56" font-weight="700">• 1x Mineral Water 1L</text>
      <line x1="0" y1="75" x2="300" y2="75" stroke="#E2E8F0"/>
      <text y="102" font-weight="800" font-size="15" fill="#0F172A">Current Order Total: ₹1,620.00</text>
      <text y="130" fill="#64748B" font-size="11">Assigned Waiter: Rahul M.</text>
    </g>

    <!-- Transfer Arrow -->
    <circle cx="500" cy="260" r="30" fill="#7C3AED"/>
    <text x="488" y="268" font-size="24" fill="#FFF">➔</text>
    <text x="500" y="310" fill="#7C3AED" font-family="sans-serif" font-weight="800" font-size="12" text-anchor="middle">TRANSFER</text>

    <!-- Destination Table -->
    <rect x="560" y="140" width="340" height="240" rx="14" fill="#F8FAFC" stroke="#10B981" stroke-width="2"/>
    <rect x="560" y="140" width="340" height="36" rx="14" fill="#10B981"/>
    <text x="730" y="163" fill="#FFF" font-family="sans-serif" font-weight="800" font-size="13" text-anchor="middle">DESTINATION: TABLE T-08 (ROOFTOP)</text>
    <g transform="translate(580, 205)" font-family="sans-serif" font-size="13" fill="#334155">
      <text y="0" font-weight="700" fill="#10B981">Table Status: VACANT (Ready to receive)</text>
      <text y="28">Capacity: 6 Pax Outdoor Seating</text>
      <text y="56">New Waiter Assignment: Suresh K.</text>
      <line x1="0" y1="75" x2="300" y2="75" stroke="#E2E8F0"/>
      <text y="102" font-weight="800" font-size="13" fill="#0F172A">Actions: Full Order Relocation</text>
      <text y="130" fill="#64748B" font-size="11">Zero line-item loss • Auto-updates KDS station</text>
    </g>

    <!-- Confirmation Bar -->
    <rect x="95" y="420" width="805" height="75" rx="12" fill="#F0FDF4" stroke="#BBF7D0"/>
    <text x="120" y="450" fill="#166534" font-family="sans-serif" font-size="13" font-weight="800">EXECUTE 1-TAP TABLE TRANSFER</text>
    <text x="120" y="475" fill="#15803D" font-family="sans-serif" font-size="12">Re-allocates all pending items, active prep timers, and historical running checks to the destination table instantly.</text>
    
  </g>
</svg>